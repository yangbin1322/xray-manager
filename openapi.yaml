openapi: 3.0.3
info:
  title: Xray Manager HTTP API
  version: 1.2.0
  description: 管理 Xray Manager 节点、分组、订阅、故障转移、链式代理和动态会话代理的 REST API。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Nodes
  - name: Groups
  - name: Subscriptions
  - name: Load Balancers
  - name: Chain Proxies
  - name: Session Relays
paths:
  /health:
    get:
      tags: [System]
      summary: 检查 API 状态
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /nodes:
    get:
      tags: [Nodes]
      summary: 获取全部节点
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Node' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Nodes]
      summary: 创建节点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeInput' }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/NodeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /nodes/start:
    post:
      tags: [Nodes]
      summary: 批量启动节点
      requestBody: { $ref: '#/components/requestBodies/NodeIDs' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /nodes/stop:
    post:
      tags: [Nodes]
      summary: 批量停止节点
      requestBody: { $ref: '#/components/requestBodies/NodeIDs' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /nodes/delete:
    post:
      tags: [Nodes]
      summary: 批量删除节点
      description: |
        支持普通节点、故障转移、链式代理和动态会话代理。会先批量停止，
        再一次性移除并保存配置，比逐个调用 DELETE /nodes/{id} 快得多。
        用 POST 而非 DELETE：带请求体的 DELETE 在部分客户端/代理上支持不佳。
      requestBody: { $ref: '#/components/requestBodies/NodeIDs' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /local-proxies:
    get:
      tags: [Nodes]
      summary: 获取全部本地代理
      description: 返回普通节点、故障转移和链式代理的 HTTP/SOCKS5 URL，包括未启动的资源。
      responses:
        '200': { $ref: '#/components/responses/LocalProxyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /local-proxies/enabled:
    get:
      tags: [Nodes]
      summary: 获取全部已启动资源的本地代理
      responses:
        '200': { $ref: '#/components/responses/LocalProxyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /nodes/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Nodes]
      summary: 获取节点
      responses:
        '200': { description: 节点, content: { application/json: { schema: { $ref: '#/components/schemas/NodeResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Nodes]
      summary: 修改节点
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Nodes]
      summary: 删除节点
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /nodes/{id}/start:
    post:
      tags: [Nodes]
      summary: 启动节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /nodes/{id}/stop:
    post:
      tags: [Nodes]
      summary: 停止节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /load-balancers:
    get:
      tags: [Load Balancers]
      summary: 获取全部故障转移节点
      responses:
        '200': { description: 故障转移列表, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerListResponse' } } } }
    post:
      tags: [Load Balancers]
      summary: 创建故障转移节点
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerInput' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /load-balancers/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Load Balancers]
      summary: 获取故障转移节点
      responses: { '200': { description: 故障转移节点, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Load Balancers]
      summary: 修改故障转移节点
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerInput' } } } }
      responses: { '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/LoadBalancerResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Load Balancers]
      summary: 删除故障转移节点
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /load-balancers/{id}/start:
    post:
      tags: [Load Balancers]
      summary: 启动故障转移节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /load-balancers/{id}/stop:
    post:
      tags: [Load Balancers]
      summary: 停止故障转移节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /load-balancers/{id}/local-proxy:
    get:
      tags: [Load Balancers]
      summary: 获取指定故障转移节点的本地代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { description: 本地代理, content: { application/json: { schema: { $ref: '#/components/schemas/LocalProxyResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /load-balancers/local-proxies:
    get:
      tags: [Load Balancers]
      summary: 获取全部故障转移本地代理
      responses: { '200': { $ref: '#/components/responses/LocalProxyList' } }
  /load-balancers/local-proxies/enabled:
    get:
      tags: [Load Balancers]
      summary: 获取已启动的故障转移本地代理
      responses: { '200': { $ref: '#/components/responses/LocalProxyList' } }
  /chain-proxies:
    get:
      tags: [Chain Proxies]
      summary: 获取全部链式代理
      responses:
        '200': { description: 链式代理列表, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyListResponse' } } } }
    post:
      tags: [Chain Proxies]
      summary: 创建链式代理
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyInput' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /chain-proxies/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Chain Proxies]
      summary: 获取链式代理
      responses: { '200': { description: 链式代理, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Chain Proxies]
      summary: 修改链式代理
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyInput' } } } }
      responses: { '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/ChainProxyResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Chain Proxies]
      summary: 删除链式代理
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /chain-proxies/{id}/start:
    post:
      tags: [Chain Proxies]
      summary: 启动链式代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /chain-proxies/{id}/stop:
    post:
      tags: [Chain Proxies]
      summary: 停止链式代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /chain-proxies/{id}/local-proxy:
    get:
      tags: [Chain Proxies]
      summary: 获取指定链式代理的本地代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { description: 本地代理, content: { application/json: { schema: { $ref: '#/components/schemas/LocalProxyResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /chain-proxies/local-proxies:
    get:
      tags: [Chain Proxies]
      summary: 获取全部链式本地代理
      responses: { '200': { $ref: '#/components/responses/LocalProxyList' } }
  /chain-proxies/local-proxies/enabled:
    get:
      tags: [Chain Proxies]
      summary: 获取已启动的链式本地代理
      responses: { '200': { $ref: '#/components/responses/LocalProxyList' } }
  /session-relays:
    get:
      tags: [Session Relays]
      summary: 获取全部动态会话代理
      responses:
        '200': { description: 动态会话代理列表, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayListResponse' } } } }
    post:
      tags: [Session Relays]
      summary: 创建动态会话代理
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayInput' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /session-relays/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Session Relays]
      summary: 获取动态会话代理
      responses: { '200': { description: 动态会话代理, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Session Relays]
      summary: 修改动态会话代理
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayInput' } } } }
      responses: { '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/SessionRelayResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Session Relays]
      summary: 删除动态会话代理
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /session-relays/{id}/start:
    post:
      tags: [Session Relays]
      summary: 启动动态会话代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /session-relays/{id}/stop:
    post:
      tags: [Session Relays]
      summary: 停止动态会话代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /groups:
    get:
      tags: [Groups]
      summary: 获取全部分组
      responses:
        '200': { description: 分组列表, content: { application/json: { schema: { $ref: '#/components/schemas/GroupListResponse' } } } }
    post:
      tags: [Groups]
      summary: 创建分组
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/GroupResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /groups/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Groups]
      summary: 获取分组
      responses:
        '200': { description: 分组, content: { application/json: { schema: { $ref: '#/components/schemas/GroupResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Groups]
      summary: 修改分组
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } } }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/GroupResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Groups]
      summary: 级联删除分组及组内节点
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{id}/start:
    post:
      tags: [Groups]
      summary: 启动分组内全部节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /groups/{id}/stop:
    post:
      tags: [Groups]
      summary: 停止分组内全部节点
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } }
  /groups/{id}/local-proxies:
    get:
      tags: [Groups]
      summary: 获取指定分组的本地代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/LocalProxyList' }
        '404': { $ref: '#/components/responses/NotFound' }
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: 获取全部订阅
      responses:
        '200': { description: 订阅列表, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionListResponse' } } } }
    post:
      tags: [Subscriptions]
      summary: 创建并拉取订阅
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } } }
      responses:
        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /subscriptions/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Subscriptions]
      summary: 获取订阅
      responses:
        '200': { description: 订阅, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Subscriptions]
      summary: 修改订阅配置
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionInput' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Subscriptions]
      summary: 删除订阅及其节点
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /subscriptions/{id}/update:
    post:
      tags: [Subscriptions]
      summary: 立即更新订阅
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /subscriptions/{id}/local-proxies:
    get:
      tags: [Subscriptions]
      summary: 获取指定订阅的本地代理
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/LocalProxyList' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings/pre-proxy:
    get:
      tags: [Settings]
      summary: 获取全局前置代理
      description: 客户端全局前置代理节点。启动普通节点/故障转移/链式代理时会经此前置节点出站，用于加速。
      responses:
        '200':
          description: 前置代理配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PreProxyConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Settings]
      summary: 设置前置代理及生效范围
      description: |
        body.nodeId 为普通节点 ID；传空字符串清除（同时清空生效范围）。
        已运行节点需重新启动后生效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId: { type: string, description: 前置节点 ID（普通节点/链式代理/故障转移），空表示清除 }
                enabled: { type: boolean, description: 是否启用。关闭时保留所选节点与生效范围 }
                groupIds:
                  type: array
                  items: { type: string }
                  description: 生效范围（分组 ID）。留空表示对全部节点生效
                excludedIds:
                  type: array
                  items: { type: string }
                  description: 例外节点 ID。即使落在生效范围内也直连
      responses:
        '200':
          description: 更新后的前置代理配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PreProxyConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    NodeIDs:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids: { type: array, minItems: 1, items: { type: string } }
  responses:
    Success:
      description: 操作成功
      content: { application/json: { schema: { $ref: '#/components/schemas/Response' } } }
    BadRequest:
      description: 请求参数无效
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Token 缺失或无效
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    LocalProxyList:
      description: 本地代理列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Response'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LocalProxy' } }
  schemas:
    PreProxyConfig:
      type: object
      properties:
        nodeId: { type: string, description: 前置节点 ID }
        enabled: { type: boolean, description: 是否启用。关闭时保留所选节点与生效范围 }
        alias: { type: string, description: 节点别名 }
        type: { type: string, enum: [rule, chain, lb], description: 节点类型 }
        groupIds:
          type: array
          items: { type: string }
          description: 生效范围（分组 ID）。留空表示对全部节点生效
        excludedIds:
          type: array
          items: { type: string }
          description: 例外节点 ID。即使落在生效范围内也直连

    Response:
      type: object
      properties:
        data: {}
        error: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, example: 节点不存在 }
    LocalProxy:
      type: object
      required: [id, type, alias, localPort, httpUrl, socks5Url, enabled, source]
      properties:
        id: { type: string }
        type: { type: string, enum: [rule, loadBalancer, chainProxy] }
        alias: { type: string }
        localPort: { type: integer }
        httpUrl: { type: string, example: 'http://127.0.0.1:1080' }
        socks5Url: { type: string, example: 'socks5://127.0.0.1:1080' }
        enabled: { type: boolean }
        groupId: { type: string }
        groupName: { type: string }
        source: { type: string, enum: [manual, subscription] }
    LocalProxyResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/LocalProxy' } }
    NodeInput:
      type: object
      required: [protocol, serverAddr, serverPort, settings]
      properties:
        alias: { type: string }
        localType: { type: string, default: mixed }
        localPort: { type: integer, minimum: 0, maximum: 65535, description: 0 表示自动分配 }
        protocol: { type: string, enum: [shadowsocks, vmess, vless, trojan, http, socks, hysteria2, tuic] }
        serverAddr: { type: string }
        serverPort: { type: integer, minimum: 1, maximum: 65535 }
        settings: { $ref: '#/components/schemas/ProxySettings' }
        groupId: { type: string }
    Node:
      allOf:
        - $ref: '#/components/schemas/NodeInput'
        - type: object
          properties:
            id: { type: string }
            enabled: { type: boolean }
            verifying:
              type: boolean
              description: |
                已启动但连通性尚未验证完成。启动只说明本地端口起来了，
                能否访问外网还要经代理探测一次；此时节点可能几秒后被判定
                不通并自动停用，不宜直接当作可用。
            processId: { type: integer }
            realIp: { type: string }
            source: { type: string, enum: [manual, subscription] }
            groupName: { type: string }
            lastError: { type: string }
            latency: { type: integer }
            downloadSpeed: { type: number }
            healthStatus: { type: string }
    NodeResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Node' } }
    LoadBalancerInput:
      type: object
      required: [alias, localPort, nodeIds]
      properties:
        alias: { type: string }
        localType: { type: string, default: mixed }
        localPort: { type: integer, minimum: 1, maximum: 65535 }
        nodeIds: { type: array, minItems: 1, items: { type: string }, description: 参与故障转移的普通节点 ID }
        groupId: { type: string }
    LoadBalancer:
      allOf:
        - $ref: '#/components/schemas/LoadBalancerInput'
        - type: object
          properties:
            id: { type: string }
            enabled: { type: boolean }
            processId: { type: integer }
            realIp: { type: string }
            lastError: { type: string }
            groupName: { type: string }
            latency: { type: integer }
            downloadSpeed: { type: number }
            healthStatus: { type: string }
            lastStartTime: { type: string }
            lastStopTime: { type: string }
    LoadBalancerResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/LoadBalancer' } }
    LoadBalancerListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/LoadBalancer' } } }
    ChainProxyInput:
      type: object
      required: [alias, localPort, chainNodes]
      properties:
        alias: { type: string }
        localType: { type: string, default: mixed }
        localPort: { type: integer, minimum: 1, maximum: 65535 }
        chainNodes: { type: array, minItems: 2, items: { type: string }, description: 按流量顺序排列的普通节点或故障转移节点 ID }
        groupId: { type: string }
    ChainProxy:
      allOf:
        - $ref: '#/components/schemas/ChainProxyInput'
        - type: object
          properties:
            id: { type: string }
            enabled: { type: boolean }
            processId: { type: integer }
            realIp: { type: string }
            lastError: { type: string }
            groupName: { type: string }
            latency: { type: integer }
            downloadSpeed: { type: number }
            healthStatus: { type: string }
            lastStartTime: { type: string }
            lastStopTime: { type: string }
    ChainProxyResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/ChainProxy' } }
    ChainProxyListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/ChainProxy' } } }
    SessionRelayInput:
      type: object
      required: [alias, upstreamAddr]
      properties:
        alias: { type: string }
        localPort: { type: integer, minimum: 0, maximum: 65535, description: 混合端口，HTTP 与 SOCKS5 客户端均可接入；0 表示自动分配 }
        upstreamAddr: { type: string, example: 'gw.dataimpulse.com:823', description: 上游住宅代理网关 host:port }
        usernameTemplate: { type: string, example: 'login__cr.au;sessid.{session}', description: '上游用户名模板，{session} 会被替换为客户端传入的用户名；留空表示原样透传' }
        upstreamPassword: { type: string, format: password }
        localPassword: { type: string, format: password, description: 客户端需提供的代理密码，留空表示不校验 }
        preProxyNodeId: { type: string, description: '前置加速节点/链式/故障转移 ID；留空表示直连上游，特殊值 __global__ 表示跟随全局前置代理设置' }
        groupId: { type: string }
    SessionRelay:
      allOf:
        - $ref: '#/components/schemas/SessionRelayInput'
        - type: object
          properties:
            id: { type: string }
            enabled: { type: boolean }
            lastError: { type: string }
            groupName: { type: string }
            activeConns: { type: integer }
            totalConns: { type: integer }
            sessionCount: { type: integer }
            lastStartTime: { type: string }
            lastStopTime: { type: string }
    SessionRelayResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/SessionRelay' } }
    SessionRelayListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/SessionRelay' } } }
    ProxySettings:
      type: object
      additionalProperties: false
      properties:
        ssMethod: { type: string }
        ssPassword: { type: string, format: password }
        vmessUserId: { type: string }
        vmessAlterId: { type: integer }
        vmessSecurity: { type: string }
        vlessUserId: { type: string }
        vlessFlow: { type: string }
        vlessEncryption: { type: string }
        trojanPassword: { type: string, format: password }
        httpUsername: { type: string }
        httpPassword: { type: string, format: password }
        socksUsername: { type: string }
        socksPassword: { type: string, format: password }
        socksVersion: { type: string }
        hy2Password: { type: string, format: password }
        tuicUserId: { type: string }
        tuicPassword: { type: string, format: password }
        network: { type: string, enum: [tcp, ws, grpc, h2] }
        security: { type: string, enum: [none, tls, reality] }
        tls: { type: object, additionalProperties: true }
        ws: { type: object, additionalProperties: true }
        grpc: { type: object, additionalProperties: true }
        h2: { type: object, additionalProperties: true }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupInput'
        - type: object
          properties:
            id: { type: string }
            source: { type: string, enum: [manual, subscription] }
            subscriptionId: { type: string }
            createdAt: { type: string }
    GroupResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Group' } }
    GroupListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Group' } } }
    SubscriptionInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        autoUpdate: { type: boolean, default: false }
        updateInterval: { type: integer, minimum: 0, description: 小时 }
        updateMode: { type: string, enum: [direct, system, proxy], default: direct }
        updateProxyId: { type: string }
        groupId:
          type: string
          description: |
            目标分组。创建时为空表示按订阅名新建分组；编辑时为空表示保持当前分组。
            多个订阅可指定同一分组，把各自的节点汇入同一分组统一管理。
    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionInput'
        - type: object
          properties:
            id: { type: string }
            type: { type: string }
            groupId: { type: string }
            enabled: { type: boolean }
            lastUpdate: { type: string }
            nextUpdate: { type: string }
            nodeCount: { type: integer }
    SubscriptionResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { $ref: '#/components/schemas/Subscription' } }
    SubscriptionListResponse:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Subscription' } } }
