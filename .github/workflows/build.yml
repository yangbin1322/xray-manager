name: Build Wails App

on:
  push:
    branches: [ main, 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.24.0"

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.41

      - name: Build Windows
        run: wails3 task windows:build PRODUCTION=true

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-windows-amd64
          path: bin/xray-manager.exe

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails v3 (GTK/WebKit) 构建所需系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.41

      # 诊断：确认实际编译用的 wails 库版本与其 GTK pkg-config（GTK3 vs GTK4）
      - name: Diagnose Wails version
        run: |
          echo "go.mod wails 版本:"
          go list -m github.com/wailsapp/wails/v3
          echo "operatingsystem 包的 pkg-config 声明:"
          grep -rn "pkg-config" "$(go env GOMODCACHE)/github.com/wailsapp/wails/v3@v3.0.0-alpha.41/internal/operatingsystem/" || true

      - name: Build Linux
        run: wails3 task linux:build PRODUCTION=true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-linux-amd64
          path: bin/xray-manager

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 内置 6 个内核二进制体积较大，构建 + DMG 打包会占用较多磁盘，
      # 清理 runner 上用不到的预装内容，避免 "No space left on device"
      - name: Free up disk space
        run: |
          echo "清理前:"; df -h /
          sudo rm -rf /Applications/Xcode_1[0-5]*.app || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          echo "清理后:"; df -h /

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.41

      # 内置的 darwin 内核为 arm64；macos-latest 是 Apple Silicon，
      # 默认构建即 arm64，与内置内核匹配
      - name: Build macOS ARM64
        env:
          CGO_ENABLED: "1"
        run: wails3 task darwin:package

      - name: Create DMG
        run: |
          APP_NAME="xray-manager"
          DMG_NAME="${APP_NAME}-macos-arm64.dmg"
          df -h /
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "bin/${APP_NAME}.app" \
            -ov -format UDZO \
            "bin/${DMG_NAME}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-macos-arm64
          path: bin/xray-manager-macos-arm64.dmg
