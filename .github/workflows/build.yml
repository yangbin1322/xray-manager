name: Build Multi-Platform

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build macOS ARM64
        run: wails3 task darwin:build

      - name: Upload macOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-macos-arm64
          path: build/bin/
          retention-days: 7

      - name: Build macOS Universal
        run: wails3 task darwin:build:universal
        continue-on-error: true

      - name: Upload macOS Universal
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-macos-universal
          path: build/bin/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Windows
        run: wails3 task windows:build

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-windows
          path: build/bin/
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Linux
        run: wails3 task linux:build

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-linux
          path: build/bin/
          retention-days: 7