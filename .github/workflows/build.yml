name: Build and Upload to bin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install
          fi

      - name: Build
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export CGO_ENABLED=1
          wails3 build

      - name: Debug - Show all build outputs
        run: |
          echo "=== 项目根目录的 bin ==="
          ls -lah bin/ 2>/dev/null || echo "不存在"
          
          echo ""
          echo "=== build/bin ==="
          ls -lah build/bin/ 2>/dev/null || echo "不存在"
          
          echo ""
          echo "=== 搜索所有构建产物 ==="
          find . -name "*.app" -o -name "xray-manager" -type f | grep -v node_modules | grep -v ".git"

      - name: Prepare bin directory
        run: |
          mkdir -p bin
          
          # 从可能的位置复制文件
          if [ -d "build/bin" ] && [ "$(ls -A build/bin)" ]; then
            echo "✓ 从 build/bin 复制"
            cp -r build/bin/* bin/
          fi
          
          if [ -d "build/darwin/bin" ] && [ "$(ls -A build/darwin/bin)" ]; then
            echo "✓ 从 build/darwin/bin 复制"
            cp -r build/darwin/bin/* bin/
          fi
          
          # 查找 .app
          find build -name "*.app" -type d | head -1 | while read app; do
            if [ -n "$app" ]; then
              echo "✓ 复制 .app: $app"
              cp -r "$app" bin/
            fi
          done
          
          echo ""
          echo "=== bin 目录最终内容 ==="
          ls -lah bin/
          du -sh bin/* 2>/dev/null || echo "bin 为空"

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        with:
          name: xray-manager-macos
          path: bin/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit bin to repository (optional)
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bin/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新 macOS 编译产物 [skip ci]"
            git push
          fi