<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray 管理器</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "@wailsio/runtime": "/wails/runtime.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <!-- 侧边栏：分组列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>节点分组</h3>
                <button id="addGroupBtn" class="btn-icon" title="添加分组">+</button>
            </div>
            <div class="sidebar-content">
                <div id="groupsList">
                    <!-- 分组列表将动态生成 -->
                </div>
            </div>
            <div class="sidebar-footer">
                <button id="addLoadBalanceBtn" class="btn-small btn-block" style="margin-bottom:5px;">添加负载均衡</button>
                <button id="addChainProxyBtn" class="btn-small btn-block" style="margin-bottom:5px;">添加链式代理</button>
                <button id="manageSubscriptionsBtn" class="btn-small btn-block">订阅管理</button>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
        <!-- 工具栏区域 -->
        <div class="toolbar">
            <!-- 状态过滤 (Feature 1) -->
            <div class="filter-group">
                <label>状态过滤：</label>
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="running">已启动</button>
                <button class="filter-btn" data-filter="stopped">未启动</button>
            </div>
            <!-- 深色模式切换 (Feature 3) -->
            <div class="theme-toggle">
                <button id="themeToggleBtn" class="btn-icon" title="切换深色模式">☀</button>
            </div>
            <!-- 系统代理 (Feature 5) -->
            <div class="sysproxy-group">
                <button id="enableSysProxyBtn" class="btn-action btn-small">设为系统代理</button>
                <button id="disableSysProxyBtn" class="btn-action btn-small" style="display:none;">取消系统代理</button>
            </div>
        </div>

        <!-- 转发规则表格区域 -->
        <div class="table-container">
            <table id="rulesTable">
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" title="全选">
                        </th>
                        <th style="width: 120px;">别名</th>
                        <th style="width: 100px;">协议</th>
                        <th style="width: 150px;">服务器地址</th>
                        <th style="width: 70px;">服务器端口</th>
                        <th style="width: 90px;">本地代理</th>
                        <th style="width: 80px;">本地端口</th>
                        <th style="width: 100px;" class="sortable" data-sort="latency">延迟 <span class="sort-indicator"></span></th>
                        <th style="width: 100px;" class="sortable" data-sort="downloadSpeed">速度 <span class="sort-indicator"></span></th>
                        <th style="width: 100px;">真实IP</th>
                        <th style="width: 60px;">启动</th>
                        <th style="width: 180px;">操作</th>
                    </tr>
                </thead>
                <tbody id="rulesTableBody">
                    <!-- 规则行将通过 JavaScript 动态添加 -->
                </tbody>
            </table>
        </div>

        <!-- 日志区域 -->
        <div class="log-container">
            <div class="log-header">
                <span>日志输出</span>
                <div class="log-controls">
                    <input type="text" id="logSearchInput" placeholder="搜索日志..." class="log-search">
                    <select id="logLevelFilter" class="log-filter">
                        <option value="ALL">所有日志</option>
                        <option value="INFO">INFO</option>
                        <option value="WARN">WARN</option>
                        <option value="ERROR">ERROR</option>
                        <option value="XRAY">XRAY</option>
                    </select>
                    <button id="clearLogBtn" class="btn-small">清空日志</button>
                </div>
            </div>
            <textarea id="logTextarea" readonly></textarea>
        </div>

        <!-- 底部控制区域 -->
        <div class="control-container">
            <div class="control-left">
                <label>
                    <input type="checkbox" id="autoStartCheckbox">
                    <span>开机自启</span>
                </label>
                <button id="startSelectedBtn" class="btn-action">启动选中</button>
                <button id="stopSelectedBtn" class="btn-action">停止选中</button>
                <button id="deleteSelectedBtn" class="btn-action btn-danger">删除选中</button>
                <button id="testSelectedSpeedBtn" class="btn-action">选中测速</button>
                <button id="exportSpeedReportBtn" class="btn-action">导出测速报告</button>
            </div>
            <div class="control-right">
                <input type="text" id="nodeSearchInput" placeholder="搜索节点（别名/地址/协议）..." class="search-input">
                <button id="batchImportBtn" class="btn-action">批量导入</button>
                <button id="importConfigBtn" class="btn-action">导入规则</button>
                <button id="exportConfigBtn" class="btn-action">导出规则</button>
                <button id="addRuleBtn" class="btn-primary">添加规则</button>
            </div>
        </div>
        </div>
    </div>

    <!-- 订阅管理对话框 -->
    <div id="subscriptionDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog dialog-large">
            <div class="dialog-header">
                <h3>订阅管理</h3>
                <button class="dialog-close" onclick="closeSubscriptionDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="subscription-controls">
                    <button id="addSubscriptionBtn" class="btn-primary">添加订阅</button>
                </div>
                <table id="subscriptionsTable">
                    <thead>
                        <tr>
                            <th>订阅名称</th>
                            <th>节点数</th>
                            <th>类型</th>
                            <th>最后更新</th>
                            <th>下次更新</th>
                            <th>自动更新</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="subscriptionsTableBody">
                        <!-- 订阅列表将动态生成 -->
                    </tbody>
                </table>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeSubscriptionDialog()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 添加订阅对话框 -->
    <div id="addSubscriptionDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
            <div class="dialog-header">
                <h3>添加订阅</h3>
                <button class="dialog-close" onclick="closeAddSubscriptionDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>订阅名称：</label>
                    <input type="text" id="subName" placeholder="例如：我的订阅">
                </div>
                <div class="form-group">
                    <label>订阅地址：</label>
                    <input type="text" id="subURL" placeholder="https://example.com/subscription">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="subAutoUpdate" checked>
                        自动更新
                    </label>
                </div>
                <div class="form-group">
                    <label>更新间隔（小时）：</label>
                    <input type="number" id="subUpdateInterval" value="6" min="1" max="168">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeAddSubscriptionDialog()">取消</button>
                <button class="btn-primary" onclick="saveSubscription()">添加</button>
            </div>
        </div>
    </div>

    <!-- 添加分组对话框 -->
    <div id="addGroupDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
            <div class="dialog-header">
                <h3>添加分组</h3>
                <button class="dialog-close" onclick="closeAddGroupDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>分组名称：</label>
                    <input type="text" id="groupName" placeholder="例如：美国节点">
                </div>
                <div class="form-group">
                    <label>描述：</label>
                    <input type="text" id="groupDescription" placeholder="可选">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeAddGroupDialog()">取消</button>
                <button class="btn-primary" onclick="saveGroup()">添加</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑规则对话框 -->
    <div id="ruleDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog dialog-large">
            <div class="dialog-header">
                <h3 id="dialogTitle">添加规则</h3>
                <button class="dialog-close" onclick="closeRuleDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <!-- 基本信息 -->
                <div class="form-section">
                    <h4>基本信息</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>别名：</label>
                            <input type="text" id="ruleAlias" placeholder="例如：香港节点">
                        </div>
                        <div class="form-group">
                            <label>所属分组：</label>
                            <select id="ruleGroupId">
                                <option value="">无分组</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>本地代理类型：</label>
                            <select id="ruleLocalType">
                                <option value="socks">socks</option>
                                <option value="http">http</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>本地代理端口：</label>
                            <div class="port-input-group">
                                <input type="number" id="ruleLocalPort" placeholder="例如：1080" min="1" max="65535">
                                <button type="button" id="recommendPortBtn" class="btn-small">推荐端口</button>
                                <span id="portStatus" class="port-status"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 服务器信息 -->
                <div class="form-section">
                    <h4>服务器信息</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>协议类型：</label>
                            <select id="ruleProtocol" onchange="onProtocolChange()">
                                <option value="shadowsocks">Shadowsocks</option>
                                <option value="vmess">VMess</option>
                                <option value="vless">VLESS</option>
                                <option value="trojan">Trojan</option>
                                <option value="http">HTTP</option>
                                <option value="socks">SOCKS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>服务器地址：</label>
                            <input type="text" id="ruleServerAddr" placeholder="例如：example.com">
                        </div>
                        <div class="form-group">
                            <label>服务器端口：</label>
                            <input type="number" id="ruleServerPort" placeholder="例如：443" min="1" max="65535">
                        </div>
                    </div>
                </div>

                <!-- Shadowsocks 配置 -->
                <div id="shadowsocksSettings" class="form-section protocol-settings">
                    <h4>Shadowsocks 配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>加密方法：</label>
                            <select id="ssMethod">
                                <option value="aes-256-gcm">aes-256-gcm</option>
                                <option value="aes-128-gcm">aes-128-gcm</option>
                                <option value="chacha20-poly1305">chacha20-poly1305</option>
                                <option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>密码：</label>
                            <input type="text" id="ssPassword" placeholder="密码">
                        </div>
                    </div>
                </div>

                <!-- VMess 配置 -->
                <div id="vmessSettings" class="form-section protocol-settings" style="display:none;">
                    <h4>VMess 配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户ID (UUID)：</label>
                            <input type="text" id="vmessUserId" placeholder="例如：b1e1e5c4-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                        </div>
                        <div class="form-group">
                            <label>额外ID：</label>
                            <input type="number" id="vmessAlterId" placeholder="0" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>加密方式：</label>
                            <select id="vmessSecurity">
                                <option value="auto">auto</option>
                                <option value="aes-128-gcm">aes-128-gcm</option>
                                <option value="chacha20-poly1305">chacha20-poly1305</option>
                                <option value="none">none</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- VLESS 配置 -->
                <div id="vlessSettings" class="form-section protocol-settings" style="display:none;">
                    <h4>VLESS 配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户ID (UUID)：</label>
                            <input type="text" id="vlessUserId" placeholder="例如：b1e1e5c4-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                        </div>
                        <div class="form-group">
                            <label>Flow (流控)：</label>
                            <input type="text" id="vlessFlow" placeholder="留空或填写：xtls-rprx-vision">
                        </div>
                        <div class="form-group">
                            <label>加密方式：</label>
                            <select id="vlessEncryption">
                                <option value="none">none</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Trojan 配置 -->
                <div id="trojanSettings" class="form-section protocol-settings" style="display:none;">
                    <h4>Trojan 配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>密码：</label>
                            <input type="text" id="trojanPassword" placeholder="Trojan 密码">
                        </div>
                    </div>
                </div>

                <!-- HTTP 配置 -->
                <div id="httpSettings" class="form-section protocol-settings" style="display:none;">
                    <h4>HTTP 代理配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户名（可选）：</label>
                            <input type="text" id="httpUsername" placeholder="如果需要认证请填写">
                        </div>
                        <div class="form-group">
                            <label>密码（可选）：</label>
                            <input type="text" id="httpPassword" placeholder="如果需要认证请填写">
                        </div>
                    </div>
                </div>

                <!-- SOCKS 配置 -->
                <div id="socksSettings" class="form-section protocol-settings" style="display:none;">
                    <h4>SOCKS 代理配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>SOCKS 版本：</label>
                            <select id="socksVersion">
                                <option value="socks5">SOCKS5</option>
                                <option value="socks4">SOCKS4</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>用户名（可选）：</label>
                            <input type="text" id="socksUsername" placeholder="如果需要认证请填写">
                        </div>
                        <div class="form-group">
                            <label>密码（可选）：</label>
                            <input type="text" id="socksPassword" placeholder="如果需要认证请填写">
                        </div>
                    </div>
                </div>

                <!-- 传输层配置 -->
                <div class="form-section">
                    <h4>传输层配置</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>传输协议：</label>
                            <select id="network" onchange="onNetworkChange()">
                                <option value="tcp">TCP</option>
                                <option value="ws">WebSocket</option>
                                <option value="grpc">gRPC</option>
                                <option value="h2">HTTP/2</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>传输层安全：</label>
                            <select id="security" onchange="onSecurityChange()">
                                <option value="none">none</option>
                                <option value="tls">tls</option>
                            </select>
                        </div>
                    </div>

                    <!-- TLS 配置 -->
                    <div id="tlsSettings" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>SNI (服务器名称)：</label>
                                <input type="text" id="tlsServerName" placeholder="例如：example.com">
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="tlsAllowInsecure">
                                    允许不安全连接
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- WebSocket 配置 -->
                    <div id="wsSettings" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>WebSocket 路径：</label>
                                <input type="text" id="wsPath" placeholder="例如：/ray">
                            </div>
                            <div class="form-group">
                                <label>WebSocket Host：</label>
                                <input type="text" id="wsHost" placeholder="例如：example.com">
                            </div>
                        </div>
                    </div>

                    <!-- gRPC 配置 -->
                    <div id="grpcSettings" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>gRPC 服务名：</label>
                                <input type="text" id="grpcServiceName" placeholder="例如：grpcService">
                            </div>
                        </div>
                    </div>

                    <!-- HTTP/2 配置 -->
                    <div id="h2Settings" style="display:none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>HTTP/2 路径：</label>
                                <input type="text" id="h2Path" placeholder="例如：/h2">
                            </div>
                            <div class="form-group">
                                <label>HTTP/2 Host：</label>
                                <input type="text" id="h2Host" placeholder="例如：example.com">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeRuleDialog()">取消</button>
                <button class="btn-primary" onclick="saveRule()">保存</button>
            </div>
        </div>
    </div>

    <!-- 批量导入对话框 (Feature 4) -->
    <div id="batchImportDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
            <div class="dialog-header">
                <h3>批量导入节点</h3>
                <button class="dialog-close" onclick="closeBatchImportDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>粘贴分享链接（每行一个，支持 vmess:// vless:// ss:// trojan://）：</label>
                    <textarea id="batchImportText" rows="10" style="width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ccc;border-radius:4px;resize:vertical;" placeholder="vmess://...&#10;vless://...&#10;ss://...&#10;trojan://..."></textarea>
                </div>
                <div style="margin-top:8px;">
                    <button class="btn-small" onclick="pasteFromClipboard()">从剪贴板粘贴</button>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeBatchImportDialog()">取消</button>
                <button class="btn-primary" onclick="doBatchImport()">导入</button>
            </div>
        </div>
    </div>

    <!-- 负载均衡对话框 (Feature 7) -->
    <div id="loadBalanceDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog dialog-large">
            <div class="dialog-header">
                <h3 id="lbDialogTitle">添加负载均衡节点</h3>
                <button class="dialog-close" onclick="closeLBDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>别名：</label>
                    <input type="text" id="lbAlias" placeholder="例如：负载均衡-美国">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>本地代理类型：</label>
                        <select id="lbLocalType">
                            <option value="socks">socks</option>
                            <option value="http">http</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>本地代理端口：</label>
                        <input type="number" id="lbLocalPort" placeholder="例如：10900" min="1" max="65535">
                    </div>
                </div>
                <div class="form-group">
                    <label>所属分组：</label>
                    <select id="lbGroupId">
                        <option value="">无分组</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>选择子节点（勾选要加入的节点）：</label>
                    <div id="lbNodeList" class="node-select-list">
                        <!-- 节点列表将动态生成 -->
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeLBDialog()">取消</button>
                <button class="btn-primary" onclick="saveLB()">保存</button>
            </div>
        </div>
    </div>

    <!-- 链式代理对话框 (Feature 8) -->
    <div id="chainProxyDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog dialog-large">
            <div class="dialog-header">
                <h3 id="chainDialogTitle">添加链式代理</h3>
                <button class="dialog-close" onclick="closeChainDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>别名：</label>
                    <input type="text" id="chainAlias" placeholder="例如：链式-HK→US">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>本地代理类型：</label>
                        <select id="chainLocalType">
                            <option value="socks">socks</option>
                            <option value="http">http</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>本地代理端口：</label>
                        <input type="number" id="chainLocalPort" placeholder="例如：10901" min="1" max="65535">
                    </div>
                </div>
                <div class="form-group">
                    <label>所属分组：</label>
                    <select id="chainGroupId">
                        <option value="">无分组</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>选择链中的节点（按顺序添加，支持普通节点和负载均衡节点）：</label>
                    <div id="chainNodeList" class="node-select-list">
                        <!-- 节点列表将动态生成 -->
                    </div>
                </div>
                <div class="form-group">
                    <label>已选节点（拖拽调整顺序，流量方向: 第1个 → 第2个 → ... → 落地）：</label>
                    <div id="chainSelectedNodes" class="chain-selected-nodes">
                        <!-- 已选节点将动态生成 -->
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeChainDialog()">取消</button>
                <button class="btn-primary" onclick="saveChain()">保存</button>
            </div>
        </div>
    </div>

    <script type="module" src="bindings/xray-manager/internal/models/index.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
