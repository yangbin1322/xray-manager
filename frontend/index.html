<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gost 管理器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 转发规则表格区域 -->
        <div class="table-container">
            <table id="rulesTable">
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" title="全选">
                        </th>
                        <th style="width: 150px;">别名</th>
                        <th style="width: 240px;">代理信息</th>
                        <th style="width: 100px;">本地代理类型</th>
                        <th style="width: 100px;">本地代理端口</th>
                        <th style="width: 95px;">真实IP</th>
                        <th style="width: 90px;">使用IP代理</th>
                        <th style="width: 60px;">启动</th>
                        <th style="width: 100px;">操作</th>
                    </tr>
                </thead>
                <tbody id="rulesTableBody">
                    <!-- 规则行将通过 JavaScript 动态添加 -->
                </tbody>
            </table>
        </div>

        <!-- 日志区域 -->
        <div class="log-container">
            <div class="log-header">
                <span>日志输出</span>
                <button id="clearLogBtn" class="btn-small">清空日志</button>
            </div>
            <textarea id="logTextarea" readonly></textarea>
        </div>

        <!-- 底部控制区域 -->
        <div class="control-container">
            <div class="control-left">
                <label>
                    <input type="checkbox" id="autoStartCheckbox">
                    <span>开机自启</span>
                </label>
                <button id="startSelectedBtn" class="btn-action">启动选中</button>
                <button id="stopSelectedBtn" class="btn-action">停止选中</button>
                <button id="deleteSelectedBtn" class="btn-action btn-danger">删除选中</button>
            </div>
            <div class="control-right">
                <button id="addRuleBtn" class="btn-primary">添加规则</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑规则对话框 -->
    <div id="ruleDialog" class="dialog-overlay" style="display: none;">
        <div class="dialog">
            <div class="dialog-header">
                <h3 id="dialogTitle">添加规则</h3>
                <button class="dialog-close" onclick="closeRuleDialog()">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="form-group">
                    <label>别名：</label>
                    <input type="text" id="ruleAlias" placeholder="例如：香港代理">
                </div>
                <div class="form-group">
                    <label>代理信息：</label>
                    <input type="text" id="ruleProxyInfo" placeholder="例如：http://proxy.example.com:8080">
                </div>
                <div class="form-group">
                    <label>本地代理类型：</label>
                    <select id="ruleLocalType">
                        <option value="auto">auto</option>
                        <option value="socks5">socks5</option>
                        <option value="socks4">socks4</option>
                        <option value="http">http</option>
                        <option value="http2">http2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>本地代理端口：</label>
                    <input type="number" id="ruleLocalPort" placeholder="例如：1080" min="1" max="65535">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="ruleUseIpProxy">
                        使用IP代理
                    </label>
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-secondary" onclick="closeRuleDialog()">取消</button>
                <button class="btn-primary" onclick="saveRule()">保存</button>
            </div>
        </div>
    </div>

    <script src="wailsjs/runtime/runtime.js"></script>
    <script src="wailsjs/go/main/App.js"></script>
    <script src="app.js"></script>
</body>
</html>
